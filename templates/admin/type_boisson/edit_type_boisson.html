{% extends 'admin/layout_admin.html' %}

{% block title %}
    <title>modifier un type d'boisson</title>
{% endblock %}

{% block body %}
  {% if error %}
    <p class=error><strong>Error:</strong> {{ error }}
  {% endif %}
<form method="post" action="/admin/type-boisson/edit">
    <fieldset>
        <legend> Modifier un type de boisson</legend>
        <div class="mb-3">
        <input type="hidden" name="id_type_boisson" size="18" value="{{ type_boisson.id_type_boisson }}" id="id_type_boisson">
        <label for="nom_type_boisson">nom_type_boisson</label><br>
        <input class="form-select" type="text" name="nom_type_boisson" size="18" value="{{ type_boisson.nom_type_boisson }}" id="nom_type_boisson"><br>
        </div>
        <div class="col-12">
        <button class="btn btn-primary" type="submit">Valider</button>
        </div>
    </fieldset>
  </form>
{% endblock %}
