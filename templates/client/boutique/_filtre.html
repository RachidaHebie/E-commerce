<form method="POST" action="/client/boisson/filtre" style="display: inline-block">

    <!-- Recherche texte -->
    <div class="form-group">
        <input name="filter_word"
               type="text"
               placeholder="Recherche"
               size="15"
               class="form-control"
               value="{{ filter_word }}">
    </div>


    <!-- Filtre type -->
    {% if items_filtre %}
    <div class="form-group">
        <h4>Types de boissons</h4>

        {% for item in items_filtre %}
            <input type="checkbox"
                   name="filter_types"
                   value="{{ item.id_type_boisson }}"
                   {% if item.id_type_boisson|string in filter_types %}
                        checked
                   {% endif %}>
            {{ item.nom_type_boisson }}
            <br>
        {% endfor %}
    </div>
    {% endif %}


    <!-- Filtre prix -->
    <div class="form-group">
        <h5>Prix :</h5>

        <input name="filter_value_min"
               type="number"
               step="0.01"
               placeholder="min"
               size="5"
               value="{{ filter_value_min }}">

        <input name="filter_value_max"
               type="number"
               step="0.01"
               placeholder="max"
               size="5"
               value="{{ filter_value_max }}">
    </div>

    <button type="submit" class="btn btn-primary">
        Filtrer
    </button>
</form>


<!-- Bouton reset filtre -->
{% if filter_word or filter_value_min or filter_value_max or filter_types %}
<form action="/client/boisson/filtre/reset"
      method="GET"
      style="display: inline-block; margin: 5px;">

    <button class="btn btn-secondary">
        Supprimer filtre
    </button>
</form>
{% endif %}
